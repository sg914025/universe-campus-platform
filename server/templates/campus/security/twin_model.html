{% load campus_ui %}{{ twin_data|json_script:'security-twin-data' }}<section class="security-twin"><div class="twin-toolbar"><span><i class="live-dot"></i> FIRST-PARTY MODEL</span><span>{% tr '拖动旋转 · 点击节点查看证据' %}</span><button type="button" id="twin-pause">{% tr '暂停动画' %}</button></div><canvas id="security-twin" role="img" aria-label="{% tr '校园应用与数据库逻辑关联模型' %}"></canvas><div class="twin-hud"><span>01 / LOGICAL PLANE</span><b>UNIVERSE</b><small>{% tr '服务状态来自最近快照，当前页面本身可达。' %}</small></div></section>
