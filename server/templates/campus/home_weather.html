{% load campus_ui %}<section class="home-weather" aria-label="{% tr '当地天气' %}" data-url="{% url 'home-weather' %}"><div class="home-weather-heading"><span>{% tr '当地天气' %}</span><button type="button" id="weather-refresh" aria-label="{% tr '刷新天气' %}">↻</button></div><div id="home-weather-report" aria-live="polite"><p>{% tr '选择城市，看看当地天气。' %}</p></div><p id="home-weather-status" role="status"></p><details id="home-weather-settings" open><summary>{% tr '切换城市' %}</summary><form id="home-weather-form">{% csrf_token %}<label class="weather-sr" for="weather-city">{% tr '城市名称' %}</label><div><input id="weather-city" maxlength="60" minlength="2" required autocomplete="off" placeholder="{% tr '输入城市，如大连' %}"><button type="submit">{% tr '查询' %}</button></div></form><div id="home-weather-choices"></div><button type="button" id="weather-device">⌖ {% tr '自动定位' %}</button> <button type="button" id="weather-ip">◎ {% tr 'IP 定位' %}</button><small>{% tr '优先设备定位；不可用时自动使用 IP 定位，也可手动选择城市。设备定位需浏览器授权，IP 定位可能受 VPN 或校园网影响。' %}</small></details><div class="weather-sources"><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a><span id="weather-ip-source" hidden> · <a href="https://www.geojs.io/" target="_blank" rel="noopener noreferrer">GeoJS</a></span></div></section>
