{% load campus_ui %}{% if flow_plan %}<style>.plan-resume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;margin:0 0 20px;border:1px solid #91ab8b55;border-radius:18px;background:linear-gradient(110deg,#a9c99b18,#d2c4e31a);font-size:14px}.plan-resume p{margin:4px 0;max-width:640px;overflow-wrap:anywhere}.plan-resume small{opacity:.7}.plan-resume a{border:1px solid #91ab8b66;border-radius:10px;padding:10px 14px;text-decoration:none;color:inherit;white-space:normal}.plan-resume form{display:none}</style><section class="plan-resume" aria-label="{% tr '我的办事计划' %}"><div><strong>{% tr '我的办事计划' %} · {{ flow_plan.completed|length }} / {{ flow_plan.steps|length }}</strong><p>{{ flow_plan.source }}</p><small>{% tr '办理进度自动保存，可以随时回来继续。' %}</small></div><a href="{% url 'task-assistant' %}#service-plan-panel">{% tr '继续办事计划' %} ↗</a><form>{% csrf_token %}</form></section>{% endif %}
