{% load campus_ui %}<div class="security-chart" role="img" aria-label="{% tr '最近十四天安全评分' %}">{% for point in history %}<div class="security-chart-col"><span>{% if point.score != None %}{{ point.score }}{% else %}—{% endif %}</span><i class="{% if point.score == None %}empty{% endif %}" style="--value:{{ point.score|default_if_none:0 }}"></i><small>{{ point.label }}</small></div>{% endfor %}</div>
